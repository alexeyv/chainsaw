[package]
name = "chainsaw"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Agentic software development process supervisor"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
regex = "1.11"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde_json = "1.0"
sha1 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
