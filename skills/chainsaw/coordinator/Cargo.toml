[package]
name = "chainsaw"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Agentic software development process supervisor"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
regex = "1.13"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
shell-words = "1"
strum = { version = "0.28", features = ["derive"] }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
